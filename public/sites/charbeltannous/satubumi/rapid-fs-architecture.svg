<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0d0b; font-family:'JetBrains Mono', monospace;">
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2e20" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#0c120e"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.6"/>

  <!-- Brutalist Header Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="8" fill="#132418" stroke="#25e076" stroke-width="2"/>
  <circle cx="80" cy="70" r="10" fill="#25e076"/>
  <text x="110" y="76" fill="#25e076" font-size="16" font-weight="bold" letter-spacing="2">SATUBUMI // RAPID-FS 7-STAGE CARBON ENGINE PIPELINE</text>
  <text x="960" y="76" fill="#88b598" font-size="14">STATUS: PRODUCTION ACTIVE</text>

  <!-- Stage 1: Ingestion -->
  <g transform="translate(60, 150)">
    <rect width="220" height="200" rx="12" fill="#141f17" stroke="#33593e" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="36" rx="10" fill="#1a3322"/>
    <text x="16" y="24" fill="#25e076" font-size="12" font-weight="bold">STAGE 01 // INGESTION</text>
    <text x="16" y="70" fill="#ffffff" font-size="15" font-weight="bold">ESRI Shapefile .ZIP</text>
    <text x="16" y="95" fill="#88b598" font-size="11">PyShp &amp; Shapely Parser</text>
    <text x="16" y="125" fill="#588568" font-size="11">• MultiPolygon Extraction</text>
    <text x="16" y="145" fill="#588568" font-size="11">• GeoJSON Validation</text>
    <text x="16" y="165" fill="#588568" font-size="11">• Coordinate Normalization</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 290 250 L 330 250" stroke="#25e076" stroke-width="3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <polygon points="330,245 342,250 330,255" fill="#25e076"/>

  <!-- Stage 2: Reprojection -->
  <g transform="translate(350, 150)">
    <rect width="220" height="200" rx="12" fill="#141f17" stroke="#33593e" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="36" rx="10" fill="#1a3322"/>
    <text x="16" y="24" fill="#25e076" font-size="12" font-weight="bold">STAGE 02 // GEOMETRY</text>
    <text x="16" y="70" fill="#ffffff" font-size="15" font-weight="bold">PyProj Reprojection</text>
    <text x="16" y="95" fill="#88b598" font-size="11">WGS84 &amp; UTM Transforms</text>
    <text x="16" y="125" fill="#588568" font-size="11">• Exact Hectares Area</text>
    <text x="16" y="145" fill="#588568" font-size="11">• Boundary Intersection</text>
    <text x="16" y="165" fill="#588568" font-size="11">• Buffer Zone Detection</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="580,245 592,250 580,255" fill="#25e076"/>

  <!-- Stage 3: Scoring Heuristics -->
  <g transform="translate(600, 150)">
    <rect width="240" height="200" rx="12" fill="#141f17" stroke="#25e076" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#1a4d2e"/>
    <text x="16" y="24" fill="#25e076" font-size="12" font-weight="bold">STAGE 03 // ICPFS ENGINE</text>
    <text x="16" y="70" fill="#ffffff" font-size="15" font-weight="bold">5-Pillar Carbon Scoring</text>
    <text x="16" y="95" fill="#88b598" font-size="11">Carbon · Law · Bio · Soc · Econ</text>
    <text x="16" y="125" fill="#588568" font-size="11">• Sequestration Biomass</text>
    <text x="16" y="145" fill="#588568" font-size="11">• Tenure Legality Check</text>
    <text x="16" y="165" fill="#588568" font-size="11">• Risk Discounting (15%)</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="850,245 862,250 850,255" fill="#25e076"/>

  <!-- Stage 4: Output Dossier -->
  <g transform="translate(870, 150)">
    <rect width="260" height="200" rx="12" fill="#141f17" stroke="#33593e" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#1a3322"/>
    <text x="16" y="24" fill="#25e076" font-size="12" font-weight="bold">STAGE 04 // REPORTING</text>
    <text x="16" y="70" fill="#ffffff" font-size="15" font-weight="bold">MRV Executive Report</text>
    <text x="16" y="95" fill="#88b598" font-size="11">Automated PDF / ReportLab</text>
    <text x="16" y="125" fill="#588568" font-size="11">• Est. Carbon Credit Yield</text>
    <text x="16" y="145" fill="#588568" font-size="11">• USD ⇄ IDR Cached Forex</text>
    <text x="16" y="165" fill="#588568" font-size="11">• Feasibility Grade (A-F)</text>
  </g>

  <!-- Lower Panel: Satellite Telemetry -->
  <g transform="translate(60, 400)">
    <rect width="1070" height="210" rx="16" fill="#101a13" stroke="#25e076" stroke-width="2"/>
    <rect x="0" y="0" width="1070" height="40" rx="12" fill="#162b1c"/>
    <text x="24" y="26" fill="#25e076" font-size="14" font-weight="bold">GOOGLE EARTH ENGINE (GEE) // SENTINEL-2 &amp; HANSEN GFC TELEMETRY LAYER</text>

    <!-- Metrics box 1 -->
    <rect x="30" y="65" width="230" height="115" rx="8" fill="#172b1e" stroke="#33593e" stroke-width="1.5"/>
    <text x="45" y="95" fill="#88b598" font-size="11">COPERNICUS SENTINEL-2</text>
    <text x="45" y="130" fill="#25e076" font-size="24" font-weight="bold">0.82 NDVI</text>
    <text x="45" y="155" fill="#ffffff" font-size="11">High Canopy Vigor Index</text>

    <!-- Metrics box 2 -->
    <rect x="290" y="65" width="230" height="115" rx="8" fill="#172b1e" stroke="#33593e" stroke-width="1.5"/>
    <text x="305" y="95" fill="#88b598" font-size="11">HANSEN GLOBAL FOREST</text>
    <text x="305" y="130" fill="#25e076" font-size="24" font-weight="bold">+14.2%</text>
    <text x="305" y="155" fill="#ffffff" font-size="11">Net Reforestation Gain</text>

    <!-- Metrics box 3 -->
    <rect x="550" y="65" width="230" height="115" rx="8" fill="#172b1e" stroke="#33593e" stroke-width="1.5"/>
    <text x="565" y="95" fill="#88b598" font-size="11">FIELD TREE CENSUS</text>
    <text x="565" y="130" fill="#25e076" font-size="24" font-weight="bold">92.4%</text>
    <text x="565" y="155" fill="#ffffff" font-size="11">Field Survival Rate (Healthy)</text>

    <!-- Metrics box 4 -->
    <rect x="810" y="65" width="230" height="115" rx="8" fill="#172b1e" stroke="#33593e" stroke-width="1.5"/>
    <text x="825" y="95" fill="#88b598" font-size="11">ALERT ENGINE STATUS</text>
    <text x="825" y="130" fill="#25e076" font-size="24" font-weight="bold">0 CRITICAL</text>
    <text x="825" y="155" fill="#ffffff" font-size="11">All Plots Compliant (&gt;30d)</text>
  </g>
</svg>